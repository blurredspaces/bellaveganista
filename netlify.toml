# No build step — the site is served as static files straight from the repo.
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Legacy store URLs.
#
# The shop has been removed from the site: the Printify store connection was
# deleted, so the Wix storefront can still take payment but orders no longer
# route to fulfilment. These paths therefore go to the homepage rather than to
# a checkout that cannot ship.
#
# 302, not 301 — this is expected to be temporary. Restore the store, then
# point these at it again.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/product-page/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/category/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/cart-page"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/shop.html"
  to = "/"
  status = 302
  force = true

# The blog genuinely lives here now, so these are permanent.
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

# Decap CMS is an editing tool, not content.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Content files change whenever DeAna publishes, so they must not be cached
# by the CDN the way fingerprinted assets are.
[[headers]]
  for = "/assets/posts.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/products.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
