# No build step — the site is served as static files straight from the repo.
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Legacy Wix URLs.
#
# The domain used to serve the Wix site, so these paths are indexed and linked
# from elsewhere. They now land on this site instead.
#
# The store redirects are TEMPORARY (302) and point at the shop page, because
# the Wix store has no working address yet. Once it answers on
# shop.bellaveganista.com, change these to 301 and forward the exact path,
# e.g. to = "https://shop.bellaveganista.com/product-page/:splat".
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/product-page/*"
  to = "/shop.html"
  status = 302

[[redirects]]
  from = "/category/*"
  to = "/shop.html"
  status = 302

[[redirects]]
  from = "/cart-page"
  to = "/shop.html"
  status = 302

# The blog genuinely lives here now, so these are permanent.
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

# Decap CMS is an editing tool, not content.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Content files change whenever DeAna publishes, so they must not be cached
# by the CDN the way fingerprinted assets are.
[[headers]]
  for = "/assets/posts.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/products.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
