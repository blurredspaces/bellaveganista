<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vegan Foodie Blog — Bella Veganista</title>
<meta name="description" content="Plant-based cooking, wellness and compassionate living — the Bella Veganista blog by DeAna."/>
<link rel="icon" href="assets/logo%20bella%20veganista.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Jost:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js?v=12"></script>
<link rel="stylesheet" href="assets/styles.css?v=12"/>
<script src="assets/site.js?v=12"></script>
</head>
<body class="font-body">

<script>renderHeader('blog')</script>

<main class="max-w-shell mx-auto px-5 sm:px-8 pt-[var(--s6)]">
  <div class="grid gap-[var(--s6)] lg:grid-cols-[1fr_320px]">

    <div>
      <h1 class="display text-[2.4rem] sm:text-[2.9rem] text-center mb-3">Vegan Foodie Blog</h1>
      <p class="text-center text-[1.02rem] text-muted max-w-[52ch] mx-auto mb-[var(--s6)]">
        Plant-based cooking, wellness and compassionate living.
      </p>

      <!-- Rendered from assets/posts.json, which Decap CMS edits at /admin/ -->
      <div id="postGrid" class="grid gap-x-[var(--s4)] gap-y-[var(--s5)] sm:grid-cols-2">
        <p class="text-muted col-span-full text-center py-[var(--s5)]">Loading posts…</p>
      </div>
    </div>

    <script>renderSidebar()</script>

  </div>
</main>

<script>renderFooter()</script>

<script src="assets/posts.js?v=12"></script>
<script>
/* Blog index — newest first. */
loadPosts().then((posts) => {
  const grid = document.getElementById('postGrid');

  if (!posts.length) {
    grid.innerHTML =
      '<p class="text-muted col-span-full text-center py-[var(--s5)]">No posts yet — check back soon.</p>';
    return;
  }

  grid.innerHTML = posts
    .map(
      (p) => `
      <a class="card" href="post.html?slug=${encodeURIComponent(p.slug)}">
        ${
          p.image
            ? `<div class="card-media aspect-[4/3]">
                 <img src="${imgURL(p.image, 700)}"${imgSrcset(p.image, 700)} alt="" loading="lazy"/>
               </div>`
            : ''
        }
        <div class="mt-5 pt-5 border-t border-rule">
          <p class="eyebrow text-sage-dp mb-2">${esc(formatDate(p.date))}</p>
          <h2 class="card-title text-[1.3rem] mb-2">${esc(p.title)}</h2>
          <p class="text-[0.95rem] text-muted leading-relaxed">${esc(p.excerpt || '')}</p>
        </div>
      </a>`
    )
    .join('');
}).catch((err) => {
  console.error('Could not load posts:', err);
  document.getElementById('postGrid').innerHTML =
    '<p class="text-muted col-span-full text-center py-[var(--s5)]">Posts are unavailable right now.</p>';
});
</script>
</body>
</html>
