<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Shop — Bella Veganista</title>
<meta name="description" content="Bella Vegan apparel, supplements, kitchenware and ebooks. Plant-based goods from DeAna at Bella Veganista."/>
<link rel="icon" href="assets/logo%20bella%20veganista.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://static.wixstatic.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Jost:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js?v=13"></script>
<link rel="stylesheet" href="assets/styles.css?v=13"/>
<script src="assets/site.js?v=13"></script>
</head>
<body class="font-body">

<!-- Catalogue is real product data; checkout is handled by the existing Wix
     store (Wix Stores + Printify fulfilment), which cannot be driven from a
     static page. Every product links through to its Wix product page. -->

<script>renderHeader('shop')</script>

<main class="max-w-shell mx-auto px-5 sm:px-8 pt-[var(--s6)]">
  <div class="grid gap-[var(--s6)] lg:grid-cols-[1fr_320px]">

    <section>
      <h1 class="display text-[2.4rem] sm:text-[2.9rem] text-center mb-4">The Shop</h1>
      <p class="text-center text-[1.02rem] text-muted max-w-[52ch] mx-auto mb-[var(--s5)]">
        Apparel, supplements and kitchen bits — everything here is made to get
        more plants into your day.
      </p>

      <div id="storeNotice"></div>

      <!-- category filter -->
      <div id="shopFilters" class="flex flex-wrap justify-center gap-2 mb-[var(--s5)]"></div>

      <div id="shopGrid" class="grid gap-x-[var(--s4)] gap-y-[var(--s5)] sm:grid-cols-2 lg:grid-cols-3">
        <p class="text-muted col-span-full text-center py-[var(--s5)]">Loading products…</p>
      </div>

      <p id="shopCount" class="text-center text-[0.85rem] text-muted mt-[var(--s5)]"></p>
    </section>

    <script>renderSidebar()</script>

  </div>
</main>

<script>renderFooter()</script>

<script>
/* ---------------------------------------------------------------------------
   Shop catalogue.

   Reads assets/products.json — currently a snapshot of the live Wix
   storefront. Point CATALOGUE_URL at the Printify proxy
   (/.netlify/functions/printify-catalog) to serve live Printify data instead;
   the response shape is identical, so nothing below needs to change.
--------------------------------------------------------------------------- */
const CATALOGUE_URL = 'assets/products.json';

let CATALOGUE = null;
let activeCat = 'All';

// Wix snapshot supplies a media id + transform; the Printify proxy supplies an
// absolute URL. Support both so the source can be swapped without edits here.
const imgFor = (d, p) => (p.image ? p.image : d.mediaBase + p.media + d.mediaTransform + p.media);
const urlFor = (d, p) => d.productBase + p.slug;
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

function cardFor(d, p) {
  const url = urlFor(d, p);
  const live = d.storeOnline !== false;

  // While the store is offline the products still show, but nothing links out —
  // sending a customer to a dead product page is worse than saying so plainly.
  const media = live
    ? `<a href="${url}" class="block" rel="noopener">
         <div class="card-media aspect-square">
           <img src="${imgFor(d, p)}" alt="${esc(p.name)}" loading="lazy"/>
         </div>
       </a>`
    : `<div class="card-media aspect-square">
         <img src="${imgFor(d, p)}" alt="${esc(p.name)}" loading="lazy"/>
       </div>`;

  const title = live
    ? `<a href="${url}" rel="noopener">${esc(p.name)}</a>`
    : esc(p.name);

  const action = live
    ? `<a class="btn btn-sage self-center" href="${url}" rel="noopener">Shop this item</a>`
    : `<span class="font-ui text-[0.72rem] tracking-[0.16em] uppercase text-muted self-center py-3">
         Back in stock soon
       </span>`;

  return `
    <article class="card flex flex-col">
      ${media}
      <div class="text-center mt-5 flex flex-col flex-1">
        <span class="card-cat">${esc(p.cat)}</span>
        <h3 class="card-title text-[1.05rem] mt-3 mb-2 flex-1">${title}</h3>
        <p class="display text-[1.15rem] mb-4">${esc(p.price)}</p>
        ${action}
      </div>
    </article>`;
}

function storeNotice(d) {
  if (d.storeOnline !== false) return '';
  return `
    <div class="border border-rule bg-shell px-6 py-5 mb-[var(--s5)] text-center">
      <p class="eyebrow text-berry mb-2">Shop update</p>
      <p class="text-[0.98rem] text-muted leading-relaxed max-w-[56ch] mx-auto">
        Our checkout is moving to a new home and is briefly unavailable.
        Everything below is still coming back — thank you for your patience.
      </p>
    </div>`;
}

function render() {
  const list =
    activeCat === 'All'
      ? CATALOGUE.products
      : CATALOGUE.products.filter((p) => p.cat === activeCat);

  document.getElementById('shopGrid').innerHTML = list
    .map((p) => cardFor(CATALOGUE, p))
    .join('');

  document.getElementById('shopCount').textContent =
    `Showing ${list.length} of ${CATALOGUE.products.length} products`;

  document.querySelectorAll('[data-cat]').forEach((b) => {
    const on = b.dataset.cat === activeCat;
    b.setAttribute('aria-pressed', String(on));
    b.className = on
      ? 'font-ui text-[0.75rem] tracking-[0.16em] uppercase px-4 py-2 bg-berry text-white transition-colors'
      : 'font-ui text-[0.75rem] tracking-[0.16em] uppercase px-4 py-2 border border-rule hover:border-berry hover:text-berry transition-colors';
  });
}

function buildFilters() {
  const cats = ['All', ...new Set(CATALOGUE.products.map((p) => p.cat))];
  const wrap = document.getElementById('shopFilters');
  wrap.innerHTML = cats
    .map((c) => `<button type="button" data-cat="${esc(c)}">${esc(c)}</button>`)
    .join('');

  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    activeCat = btn.dataset.cat;
    render();
  });
}

fetch(CATALOGUE_URL)
  .then((r) => {
    if (!r.ok) throw new Error(`catalogue returned ${r.status}`);
    return r.json();
  })
  .then((data) => {
    CATALOGUE = data;
    document.getElementById('storeNotice').innerHTML = storeNotice(data);
    buildFilters();
    render();
  })
  .catch((err) => {
    // Never leave an empty shop — send people to the working storefront.
    console.error('Could not load catalogue:', err);
    document.getElementById('shopGrid').innerHTML =
      `<p class="text-muted col-span-full text-center py-[var(--s5)]">
         Our shop is having a moment — you can
         <a class="ulink" href="https://www.bellaveganista.com/category/all-products" rel="noopener">browse everything here</a>.
       </p>`;
  });
</script>
</body>
</html>
